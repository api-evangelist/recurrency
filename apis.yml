aid: recurrency
name: Recurrency
description: >-
  Recurrency is an AI-powered ERP automation platform for wholesale distributors
  and B2B suppliers, sitting on top of distribution ERPs to automate and optimize
  purchasing and sales — forecasting, pricing, reorders and product
  recommendations across sales, purchasing and operations workflows. Recurrency
  exposes a public e-procurement REST API (documented on GitBook) for
  authenticating, retrieving and filtering a supplier's product catalog (items,
  availability, pricing, locations, groups), uploading catalog data, and creating
  and managing sales orders and quotes. It also operates a hosted, OAuth-secured
  MCP server for agent access. Backed by Bessemer Venture Partners.
